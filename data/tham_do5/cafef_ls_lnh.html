<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" charset="UTF-8" content="text/html; charset=iso-8859-1" />
    <title>404 - File or directory not found.</title>
    <style type="text/css">

    </style>
</head>

<body>
    <div id="error-container">
        <div id="mainDetail" class="postdetail clearfix">
            <div class="holder-text">This content has been removed or does not exist</div>
            <div id="holder-img"></div>
        </div>
    </div>

    <script type="text/javascript">
        var classImg = document.getElementById("holder-img");
        const pic = [
            '<img src="https://static.mediacdn.vn/images/404.png" alt="" class="image-404">',
            '<img src="https://static.mediacdn.vn/images/4041.gif" alt="" class="image-404">',
            '<img src="https://static.mediacdn.vn/images/4042.png" alt="" class="image-404">',
            '<img src="https://static.mediacdn.vn/images/4043.png" alt="" class="image-404">',
        ]
        var n = Math.floor(Math.random() * pic.length);
        if (classImg != null) {
            classImg.innerHTML = pic[n];
        }
         window.setTimeout(function () {
           window.location = 'https://s.cafef.vn/du-lieu.chn'; 
         }, 2000);
    </script>
    </script>
    <style type="text/css">
        #error-container {
            width: 100%;
            height: auto;
            display: flex;
        }

        #mainDetail {
            width: 70%;
            margin: 50px auto;
        }

        .holder-text {
            text-align: center;
            font-size: 18px;
            margin-bottom: 10px;
            margin-bottom: 10px;
            font-size: x-large;
            font-family: cursive;
            font-weight: 700;
        }

        #holder-img {
            width: 100%;
            height: 481px;
        }

        #holder-img img {
            width: 100%;
            height: 481px;
        }
    </style>


</body>

</html>
