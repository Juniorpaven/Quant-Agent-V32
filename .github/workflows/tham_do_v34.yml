name: Tham do V34 vong 4
on:
  workflow_dispatch:
  push:
    branches: [nang-cap-v34]
    paths: ['v34/kich_hoat_tham_do.txt']
permissions:
  contents: write
jobs:
  tham-do:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Tham do
        timeout-minutes: 8
        run: python -u v34/tham_do.py 2>&1 | tee tham_do_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/tham_do4 && cp tham_do_nhat_ky.txt data/tham_do4/_tom_tat.txt || true
          git add data/tham_do4
          git commit -m "Kết quả thăm dò vòng 3 [skip ci]" || echo "Không có thay đổi"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
