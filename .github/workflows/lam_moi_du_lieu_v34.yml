name: Lam moi du lieu nen V34
on:
  schedule:
    - cron: '0 2 5 * *' # ngày 5 hằng tháng: làm mới BCTC năm, cổ tức (CafeF) và hồ sơ ngành
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-v34-du-lieu
  cancel-in-progress: false
jobs:
  lam-moi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: CafeF (BCTC nam, co tuc)
        timeout-minutes: 60
        env:
          LAM_MOI: '1'
        run: python -u v34/tai_cafef.py 2>&1 | tee cafef_nhat_ky.txt
      - name: Ho so nganh
        timeout-minutes: 20
        run: python -u v34/tai_ho_so.py 2>&1 | tee ho_so_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/cafef data/ho_so && cp cafef_nhat_ky.txt data/cafef/_nhat_ky.txt || true
          cp ho_so_nhat_ky.txt data/ho_so/_nhat_ky.txt || true
          git add data/cafef data/ho_so data/_trang_thai_ho_so.json
          git commit -m "Làm mới dữ liệu nền (CafeF, hồ sơ ngành) [skip ci]" || echo "Không có thay đổi"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
