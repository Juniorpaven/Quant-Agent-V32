name: Kiem tra gia V34
on:
  workflow_dispatch:
  push:
    branches: [nang-cap-v34]
    paths: ['v34/kich_hoat_kiem_gia.txt']
permissions:
  contents: write
jobs:
  kiem-gia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Kiem gia
        timeout-minutes: 15
        run: python -u v34/kiem_gia.py 2>&1 | tee kiem_gia_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/kiem_gia && cp kiem_gia_nhat_ky.txt data/kiem_gia/_nhat_ky.txt || true
          git add data/kiem_gia
          git commit -m "Kết quả kiểm tra nhất quán giá [skip ci]" || echo "Không có thay đổi"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
