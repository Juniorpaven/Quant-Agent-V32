name: Kiem cheo CafeF quy V34
on:
  workflow_dispatch:
  push:
    branches: [nang-cap-v34]
    paths: ['v34/kich_hoat_cafef_quy.txt']
permissions:
  contents: write
jobs:
  tai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Tai
        timeout-minutes: 20
        run: python -u v34/tai_cafef_quy.py 2>&1 | tee cafef_quy_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/cafef_quy && cp cafef_quy_nhat_ky.txt data/cafef_quy/_nhat_ky.txt || true
          git add data/cafef_quy
          git commit -m "Cập nhật dữ liệu cafef_quy [skip ci]" || echo "Không có thay đổi"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
