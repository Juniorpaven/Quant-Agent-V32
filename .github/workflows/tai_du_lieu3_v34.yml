name: Tai du lieu V34 dot 3
on:
  workflow_dispatch:
  push:
    branches: [nang-cap-v34]
    paths: ['v34/kich_hoat_dot3.txt']
permissions:
  contents: write
jobs:
  tai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Tai
        timeout-minutes: 45
        run: python -u v34/tai_mo_rong2.py 2>&1 | tee dot3_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/tham_do5 && cp dot3_nhat_ky.txt data/tham_do5/_nhat_ky.txt || true
          git add data
          git commit -m "Cập nhật dữ liệu đợt 3 [skip ci]" || echo "Không có thay đổi"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
