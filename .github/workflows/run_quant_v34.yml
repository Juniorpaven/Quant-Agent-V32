name: Run Quant V34 Daily
on:
  schedule:
    - cron: '0 9 * * 1-5' # 16:00 giờ Việt Nam, chỉ thứ Hai đến thứ Sáu; ngày lễ script tự bỏ qua vì không có phiên
  workflow_dispatch:
    inputs:
      bo_qua_phien:
        description: 'Chay ca ngay khong co phien giao dich'
        type: boolean
        default: false
      khong_gui:
        description: 'Khong gui mail (chi cap nhat trang bao cao va trang thai)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: quant-v34
  cancel-in-progress: false
jobs:
  bao-cao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cai thu vien
        run: pip install pandas numpy requests google-generativeai markdown
      - name: Kiem thu tu dong
        run: python -m unittest discover -s tests -v
      - name: Chay bao cao V34
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_NHAN: ${{ secrets.EMAIL_NHAN }}
        run: python v34/bao_cao_v34.py --luu-trang-thai --xuat-trang ${{ inputs.bo_qua_phien && '--bo-qua-kiem-tra-phien' || '' }} ${{ inputs.khong_gui && '--khong-gui' || '' }}
      - name: Luu trang thai va trang bao cao
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/_trang_thai_bao_cao.json docs/BAO_CAO_MOI_NHAT.md
          git commit -m "Cập nhật báo cáo và trạng thái hằng ngày [skip ci]" || echo "Không có thay đổi"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
