name: Run Quant Bot Daily
on:
  schedule:
    - cron: '0 9 * * *' # 9:00 UTC tương đương 16:00 giờ Việt Nam
  workflow_dispatch: # Cho phép bấm nút chạy thủ công khi cần
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas numpy requests google-generativeai yfinance markdown duckduckgo-search tabulate
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python TOOL_Agent_Quant_Core_v32.py
        
      - name: Commit and push tracking history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add portfolio_tracker.json
          git commit -m "Auto-update portfolio tracker [skip ci]" || echo "No changes to commit"
          git push
