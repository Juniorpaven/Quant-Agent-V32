name: Run Quant Bot Daily
on:
  schedule:
    - cron: '30 9 * * *' # 9:30 UTC tương đương 16:00 giờ Việt Nam
  workflow_dispatch: # Cho phép bấm nút chạy thủ công khi cần

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas numpy requests google-generativeai yfinance markdown duckduckgo-search
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python TOOL_Agent_Quant_Core_v32.py
