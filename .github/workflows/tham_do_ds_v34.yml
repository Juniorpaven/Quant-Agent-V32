name: Tham do ds ma V34
on:
  workflow_dispatch:
  push:
    branches: [nang-cap-v34]
    paths: ['v34/kich_hoat_ds.txt']
permissions:
  contents: write
jobs:
  tham-do:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Tham do
        timeout-minutes: 10
        run: python -u v34/tham_do_ds.py 2>&1 | tee ds_nhat_ky.txt
      - name: Commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p data/tham_do9 && cp ds_nhat_ky.txt data/tham_do9/_nhat_ky.txt || true
          git add data/tham_do9
          git commit -m "Kết quả thăm dò danh sách mã và dữ liệu quý [skip ci]" || echo "Không có thay đổi"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
